[package]
name = "dbc-ui"
version.workspace = true
edition.workspace = true

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "907ed09c9f4476caf250e6ce4bbffb23b4622f3b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "907ed09c9f4476caf250e6ce4bbffb23b4622f3b" }
dbc-core = { path = "../dbc-core" }
dbc-buffer = { path = "../dbc-buffer" }
dbc-diff = { path = "../dbc-diff" }
dbc-state = { path = "../dbc-state" }
dbc-driver-sqlite = { path = "../dbc-driver-sqlite" }
dbc-driver-postgres = { path = "../dbc-driver-postgres" }
dbc-driver-mssql = { path = "../dbc-driver-mssql" }
# G16 T3: embedded DuckDB (bundled engine — joining this graph makes the
# first clean build noticeably longer; one-time cost, no action).
dbc-driver-duckdb = { path = "../dbc-driver-duckdb" }
unicode-segmentation = "1"
tokio.workspace = true
dirs.workspace = true
tree-sitter = "0.25"
tree-sitter-sequel = "0.3"
quick-xml = "0.41"
# Plan's Files list only calls out serde_json, but the grounding code's
# `#[derive(Deserialize)]` on `PgPlanJson`/`PgExplainRoot` needs the `serde`
# crate itself as a direct dependency too (edition-2021 extern-crate
# resolution doesn't pick it up transitively via dbc-state) — adding it here
# with the workspace's existing `derive`-feature pin.
serde.workspace = true
serde_json.workspace = true
# G12 T4: CSV import — streaming, quote-aware parser (design §5 decided
# against a hand-written RFC-4180 scanner). dbc-ui only; dbc-core stays
# free of it (csv_import.rs's pure model has no dependency on this crate
# at all — only the UI-owned parsing/peek pass in main.rs/runner.rs does).
csv = "1"
# G10 T4: masked password modals read into Zeroizing<String> before
# building admin_sql's mutation builders (design §3/CURATION item 4) —
# same discipline dbc-state's vault export_key and dbc-mcp already use.
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true
# T4 review round 1, MAJOR 2: unions with the main `tokio.workspace = true`
# dependency above for test builds — lets the bounded-timeout test use a
# paused/auto-advancing virtual clock (`#[tokio::test(start_paused = true)]`)
# instead of actually sleeping for real wall-clock seconds.
tokio = { version = "1", features = ["test-util"] }
# docker-gated integration tests (G9 T7 monitor, G13 T2 pg EXPLAIN fixtures,
# G15 T8 MSSQL live tier) — same crate+version dbc-driver-postgres's own
# integration tests pin, so no version skew; "mssql_server" feature unions
# with "postgres" in the same dependency line.
testcontainers-modules = { version = "0.13", features = ["postgres", "mssql_server"] }
