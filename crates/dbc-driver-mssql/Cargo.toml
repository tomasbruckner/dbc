[package]
name = "dbc-driver-mssql"
version = "0.1.0"
edition.workspace = true
description = "SQL Server driver for dbc (ODBC)"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dbc-core = { path = "../dbc-core" }
tokio.workspace = true
async-trait.workspace = true
# default-features pulls in "prompt" (winit + a platform windowing stack,
# for the connection-string-completion dialog), which this driver never
# invokes — we always connect via a fully-specified connection string.
# "odbc_version_3_80" is re-enabled explicitly since disabling default
# features drops it too, and it's needed for modern ODBC connection
# attributes / driver 18 compatibility. "derive" (the odbc-api-derive proc
# macro crate) is intentionally omitted: nothing in this crate uses its
# macros.
odbc-api = { version = "29", default-features = false, features = ["odbc_version_3_80"] }
# pwchange T1: wipes the UTF-16 old-password buffer in password.rs.
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
testcontainers-modules = { version = "0.13", features = ["mssql_server"] }
# Direct dep purely to switch ON testcontainers' `reusable-containers`
# feature, which `testcontainers-modules` does not pass through. Without
# it every live run leaked a ~1.25 GB SQL Server container; with it there
# is exactly ONE, reused by every run (see the test helpers' docs).
testcontainers = { version = "0.25", features = ["reusable-containers"] }
