[workspace]
resolver = "2"
members = ["crates/dbc-core", "crates/dbc-buffer", "crates/dbc-ui", "crates/dbc-driver-sqlite", "crates/dbc-driver-postgres", "crates/dbc-driver-mssql", "crates/dbc-driver-duckdb", "crates/dbc-state", "crates/dbc-mcp", "crates/dbc-diff", "crates/dbc-connect", "crates/dbc-cli"]

[workspace.package]
edition = "2021"
version = "0.32.0"
license = "MIT"
repository = "https://github.com/tomasbruckner/dbc"
authors = ["Tomáš Bruckner"]

[workspace.dependencies]
anyhow = "1"
arrow = "59"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
tempfile = "3"
argon2 = "0.5"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = "0.9"
base64 = "0.22"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = "1"
similar = "2"

# Argon2id compiled without optimisation is ~20× slower than shipped
# (3.1 s vs 0.16 s per unlock at the old cost, measured 2026-09-02). The
# vault is the one place a dev build must not feel different from a
# release; this only touches that crate, so nothing else is rebuilt.
[profile.dev.package.argon2]
opt-level = 3

# The shipped build (`release.ps1`). Thin LTO rather than fat: fat LTO over
# GPUI + bundled DuckDB makes one link take many minutes for a few percent.
# `strip = "symbols"` drops the symbol tables, not panic locations — those
# come from `Location::caller`, so `dbc.log` still names file and line.
# Panics stay `unwind`: the app's panic hook logs them, and a query thread
# that panics must not take the window with it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
