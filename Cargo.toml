[workspace]
resolver = "2"
members = ["crates/dbc-core", "crates/dbc-buffer", "crates/dbc-ui", "crates/dbc-driver-sqlite", "crates/dbc-driver-postgres", "crates/dbc-driver-mssql", "crates/dbc-driver-duckdb", "crates/dbc-state", "crates/dbc-mcp", "crates/dbc-diff", "crates/dbc-connect", "crates/dbc-cli"]

[workspace.package]
edition = "2021"
version = "0.27.0"

[workspace.dependencies]
anyhow = "1"
arrow = "59"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
tempfile = "3"
argon2 = "0.5"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = "0.9"
base64 = "0.22"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = "1"
similar = "2"
