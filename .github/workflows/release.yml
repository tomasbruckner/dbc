name: Release

# Push a tag `vX.Y.Z` (the same version as the workspace Cargo.toml) and
# this builds the shipped zip with release.ps1 and attaches it to a GitHub
# Release named after the tag. Nothing is signed; see README.
#
# It can also be run by hand for a tag that already exists (Actions →
# Release → Run workflow), so a failed run is repeated without deleting
# and re-pushing the tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.32.0"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: release.ps1 + GitHub Release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          # release.ps1 builds into its own dir with static-CRT rustflags.
          workspaces: ". -> target-release"

      - name: The tag must match Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) {
            throw "tag $env:TAG but Cargo.toml says $v — bump first (chore: vX.Y.Z)"
          }

      - name: Build and zip
        shell: pwsh
        run: ./release.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          Set-Content -Path notes.md -Value $notes

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:TAG (Get-ChildItem dist/*.zip).FullName `
            --title "dbc $env:TAG" --notes-file notes.md
